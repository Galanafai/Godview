[package]
name = "godview_node"
version = "0.1.0"
edition = "2021"
authors = ["GodView Team"]
description = "GodView perception-sharing node over Zenoh, with H3 cell topics"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "godview-node"
path = "src/main.rs"

[dependencies]
godview_core = { path = "../godview_core" }
godview_env = { path = "../godview_env" }
zenoh = { version = "1.7", default-features = false, features = ["transport_tcp"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "io-std"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
nalgebra = "0.33"
h3o = "0.9"
ed25519-dalek = "2.1"
rand = "0.8"
rand_chacha = "0.3"
